name: Deploy recurring booking function

on:
  push:
    branches:
      - arena/f832e3ee-topch
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-recurring-function.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Firebase deployment settings
        id: settings
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        shell: bash
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=Add the FIREBASE_SERVICE_ACCOUNT repository secret, then rerun this workflow." >> "$GITHUB_OUTPUT"
          elif [[ -z "$FIREBASE_PROJECT_ID" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=Add the VITE_FIREBASE_PROJECT_ID repository variable, then rerun this workflow." >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain how to enable deployment
        if: steps.settings.outputs.ready != 'true'
        env:
          SETUP_REASON: ${{ steps.settings.outputs.reason }}
        run: |
          {
            echo '## Firebase deployment is not configured yet'
            echo "$SETUP_REASON"
            echo 'After adding the missing GitHub setting, rerun this workflow from the Actions tab.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate to Google Cloud
        if: steps.settings.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy callable to Firebase
        if: steps.settings.outputs.ready == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        run: npx --yes firebase-tools deploy --non-interactive --only functions:reserveRecurringBookings --project "$FIREBASE_PROJECT_ID"
